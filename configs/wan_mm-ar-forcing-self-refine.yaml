generator_ckpt: <CKPT_FROM_STAGE2>
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_ckpt: <CKPT_FROM_STAGE1>
fake_ckpt: <CKPT_FROM_STAGE1>
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
v2v: true

sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: <YOUR_DATA_PATH>
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 8
log_iters: 50
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104
distribution_loss: mm_dmd
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
real_score_num_frame_per_block: 21
fake_score_num_frame_per_block: 21
load_raw_video: false
num_frames: 81
model_kwargs:
  timestep_shift: 5.0

# Self-refining ablation: run one fixed-noise-level P&P update at t=750.
# Index 1 is the second item in denoising_step_list. The first/last steps are
# intentionally left unchanged so layout formation and final details remain stable.
use_self_refine: true
self_refine_steps: [1]
self_refine_iterations: 1

# 0.0 means full-region refinement, matching the paper's I2V-style setting.
# After the first ablation, try 0.1/0.2 if non-edited regions drift.
self_refine_uncertainty_threshold: 0.0
self_refine_certain_percentage: 0.999
self_refine_seed: 1000003

wandb_host: https://api.wandb.ai
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
wandb_name: WANDB_NAME
